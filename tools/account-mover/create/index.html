<title>鴻綸帳號批次新增與 OU 轉移系統：批次新增帳號</title>

<link rel="stylesheet" href="style.css?v=20261126c">
<style>
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{background:#e5e7eb;color:var(--sub);border-color:#e5e7eb}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.subnav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.subnav a{padding:8px 16px;border-radius:8px;background:#e5e7eb;color:#475569;text-decoration:none;font-size:14px}.subnav a[aria-current=page]{background:#1a73e8;color:#fff;font-weight:700}
.pill.p-create{background:#dbeafe;color:#1e40af}.pill.p-move{background:#e0e7ff;color:#3730a3}
</style>
</head>
<body>
<header>
  <p id="siteLinks" class="hidden" style="margin:0 0 6px;font-size:13px"><a href="/tools/commercial" style="color:#cbd5e1">← 回商用工具</a>　<a href="/tools/license-manager/" style="color:#cbd5e1">授權管理</a>　<a href="manual.html#accounts" style="color:#cbd5e1" target="_blank" rel="noopener">使用說明書</a></p>
  <h1>鴻綸帳號批次新增與 OU <span style="white-space:nowrap">轉移系統</span></h1>
  <p>批次新增帳號。要搬移組織單位請到上方「搬移組織單位」。用你自己的管理員帳號登入，資料只在你的瀏覽器與 Google 之間往來</p>
</header>
<main>
  <nav class="subnav" aria-label="帳號批次作業"><a href="./" aria-current="page">批次新增帳號</a><a href="../">搬移組織單位</a></nav>
  <section class="card" id="login">
    <h2>登入</h2>
    <p class="hint">需要具備「使用者管理」權限的管理員帳號（新增、移動使用者）。我們不會要求密碼，登入視窗是 Google 自己的。</p>
    <div class="row"><button id="btnLogin">用 Google 管理員帳號登入</button><button id="btnDemo" class="ghost">先用示範資料練習（不連 Google）</button></div>
    <div id="loginMsg"></div>
  </section>

  <div id="app" class="hidden">
    <div class="msg info" id="who"></div>

    <section class="card" id="p-create">
      <h2>批次新增帳號</h2>
      <p class="hint">每一列一個新帳號。姓名可以填「姓名」一欄，系統自動拆成姓氏與名字（複姓會處理，仍請預演時檢查）。密碼留白，系統會產生 12 碼隨機密碼，完成後可下載帳號與密碼清單。新帳號預設「第一次登入要改密碼」。</p>
      <div class="f"><label for="defOuC">沒填組織單位的列，放到：</label><input type="text" id="defOuC" value="/" list="ouList"></div>
      <div id="gridC"></div>
      <div id="msgC"></div>
      <div class="row"><button id="planC">預演</button><button class="ghost" id="exportOu" type="button">下載目前所有使用者與組織單位（Excel）</button></div>
      <div id="outC"></div>
    </section>

  </div>
</main>
<datalist id="ouList"></datalist>

<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgB"></p><div class="row" style="justify-content:flex-end"><button class="ghost" id="dlgNo">取消</button><button id="dlgYes">確定</button></div></dialog>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="accounts.js?v=20261125a"></script>
</body>
</html>
